<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Página no encontrada · Pétalo Eterno</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FBF4F1">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #3A2229; --soft: #7A5F66; --rose: #E0708F; --rose-d: #C4506E; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 20px; font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); text-align: center; background: radial-gradient(80% 60% at 50% 35%, #FFFFFF 0%, #FBEFF2 50%, #F3D7E0 100%); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        main { max-width: 520px; position: relative; }
        .flor { display: block; width: 150px; height: 150px; margin: 0 auto 28px; border-radius: 26px; box-shadow: 0 24px 40px -20px rgba(196,80,110,.6); animation: mece 5s ease-in-out infinite; }
        @keyframes mece { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-6px); } }
        .k { font-size: 13px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--rose-d); }
        h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: clamp(40px, 9vw, 60px); line-height: 1.02; letter-spacing: -0.03em; margin: 14px 0 16px; }
        h1 em { font-style: italic; font-weight: 400; color: var(--rose); }
        p { color: var(--soft); font-size: 17.5px; line-height: 1.55; }
        .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 30px; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 28px; border-radius: 999px; font-weight: 700; font-size: 16px; text-decoration: none; }
        .a1 { color: #fff; background: linear-gradient(135deg, #EC93AB 0%, var(--rose) 48%, var(--rose-d) 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 16px 30px -14px rgba(196,80,110,.75); }
        .a2 { color: var(--ink); border: 1.5px solid rgba(58,34,41,.8); background: rgba(255,255,255,.7); }
        @media (prefers-reduced-motion: reduce) { .flor { animation: none; } }
    </style>
</head>
<body>
<main>
    <img class="flor" src="/img/logo-480.jpg" alt="Logotipo de Pétalo Eterno" width="150" height="150">
        <h1>Esta página se ha marchitado. <em>Nuestras flores, no.</em></h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no exista. Vuelve a la tienda y diseña su ramo.</p>
    <div class="btns"><a class="a1" href="/">Volver a la tienda</a><a class="a2" href="/#disena">Diseñar su ramo</a></div>
</main>
</body>
</html>
